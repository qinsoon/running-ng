[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[project]
name = "running-ng"
version = "0.4.7"
description = "Running: Next Generation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache"}
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: Apache Software License',
    'Topic :: System :: Benchmark',
    'Programming Language :: Python :: 3',
]
authors = [{name = "Zixian Cai", email = "u5937495@anu.edu.au"}]
dependencies = [
    "pyyaml~=6.0.1",
]

[project.urls]
"Homepage" = "https://github.com/anupli/running-ng"
"Bug Tracker" = "https://github.com/anupli/running-ng/issues"

[project.optional-dependencies]
zulip = [
    "zulip~=0.9.0",
]

[project.scripts]
running = "running.__main__:main"

[dependency-groups]
dev = [
    "pytest>=7.4.4,<8.5.0",
    "types-PyYAML~=6.0.12",
    "mypy>=1.8,<1.20",
    "black",
    "zulip~=0.9.0",
]

[tool.uv.build-backend]
module-name = "running"
module-root = "src"
